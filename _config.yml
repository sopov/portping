# Jekyll config for GitHub Pages (built by actions/jekyll-build-pages, i.e.
# the github-pages gem on Jekyll 3.10; keep plugins to its allow-list).
title: portping
description: Fast TCP/UDP port connectivity checker - CLI network diagnostic tool
baseurl: ""
url: "https://ping.sopov.org"
markdown: kramdown
highlighter: rouge

# Theme pinned to a release so builds are reproducible.
remote_theme: jekyll/minima@v2.5.1
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-remote-theme

author:
  name: Leonid Sopov
  url: https://www.sopov.org

# Source files that must not become pages or static files.
exclude:
  - "*.go"
  - "cmd"
  - "internal"
  - "dist"
  - "Makefile"
  - "go.mod"
  - "go.sum"
  - ".github"
  - ".git"
  - ".golangci.yml"
  - "AUDIT.md"
  - "LICENSE"
  - "Gemfile"
  - "Gemfile.lock"
  - "_site"
  - "vendor"

permalink: /:path/
